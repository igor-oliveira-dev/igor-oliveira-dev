<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="pulso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4750" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4750" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF4750" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="faixa"><rect x="0" y="0" width="1200" height="20"/></clipPath>
  </defs>
  <g clip-path="url(#faixa)">
    <rect x="0" y="9" width="1200" height="2" fill="#23252B"/>
    <rect x="-300" y="8" width="300" height="4" rx="2" fill="url(#pulso)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
