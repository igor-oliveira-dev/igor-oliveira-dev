<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Igor Oliveira. Construo sistemas que protegem, autenticam, integram e guardam dados.">
  <title>Igor Oliveira. Construo sistemas que protegem, autenticam, integram e guardam dados.</title>
  <defs>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>
  <style>
    .bg { fill: #0B0B0C; stroke: #2B2B2F; stroke-width: 1.5; }
    .name { font: 700 66px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; letter-spacing: -1px; }
    .role { font: 500 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B5B5B8; letter-spacing: 1px; }
    .lead { font: 500 30px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .word { font: italic 400 88px Georgia, 'Times New Roman', serif; }
    .pilltxt { font: 600 16px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
    .w { opacity: 0; animation: ciclo 14s infinite both; }
    .w1 { opacity: 1; animation-delay: 0s; }
    .w2 { animation-delay: 3.5s; }
    .w3 { animation-delay: 7s; }
    .w4 { animation-delay: 10.5s; }
    @keyframes ciclo {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      21%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .w { animation: none; opacity: 0; }
      .w1 { opacity: 1; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="298" rx="18" class="bg"/>
  <g clip-path="url(#card)">
    <rect x="-320" y="0" width="320" height="300" fill="url(#brilho)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1800 0" dur="9s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="13" height="300" fill="#D7191F">
      <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="70" y="152" class="name">Igor Oliveira</text>
  <text x="72" y="196" class="role">Desenvolvimento de Sistemas</text>
  <text x="654" y="124" class="lead">Construo sistemas que</text>

  <g class="w w1">
    <rect x="610" y="70" width="3" height="160" fill="#FF4750"/>
    <rect x="1010" y="56" width="150" height="34" rx="17" fill="#FF4750" fill-opacity="0.12" stroke="#FF4750" stroke-width="1.5"/>
    <text x="1085" y="78" text-anchor="middle" class="pilltxt" fill="#FF4750">segurança</text>
    <text x="652" y="224" class="word" fill="#FF4750">protegem</text>
  </g>
  <g class="w w2">
    <rect x="610" y="70" width="3" height="160" fill="#FF8A5B"/>
    <rect x="1010" y="56" width="150" height="34" rx="17" fill="#FF8A5B" fill-opacity="0.12" stroke="#FF8A5B" stroke-width="1.5"/>
    <text x="1085" y="78" text-anchor="middle" class="pilltxt" fill="#FF8A5B">2FA</text>
    <text x="652" y="224" class="word" fill="#FF8A5B">autenticam</text>
  </g>
  <g class="w w3">
    <rect x="610" y="70" width="3" height="160" fill="#FFC15E"/>
    <rect x="1010" y="56" width="150" height="34" rx="17" fill="#FFC15E" fill-opacity="0.12" stroke="#FFC15E" stroke-width="1.5"/>
    <text x="1085" y="78" text-anchor="middle" class="pilltxt" fill="#FFC15E">hardware</text>
    <text x="652" y="224" class="word" fill="#FFC15E">integram</text>
  </g>
  <g class="w w4">
    <rect x="610" y="70" width="3" height="160" fill="#FF8FB1"/>
    <rect x="1010" y="56" width="150" height="34" rx="17" fill="#FF8FB1" fill-opacity="0.12" stroke="#FF8FB1" stroke-width="1.5"/>
    <text x="1085" y="78" text-anchor="middle" class="pilltxt" fill="#FF8FB1">dados</text>
    <text x="652" y="224" class="word" fill="#FF8FB1">guardam</text>
  </g>
</svg>
