<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Visão geral animada da arquitetura de software do ASPEN CORE: aplicações, API em Node.js e Express, Firebase e Mercado Pago, além das chaves Lite e Pro.">
  <title>Visão geral animada da arquitetura de software do ASPEN CORE</title>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A5C63"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #0F1115; stroke: #2B2B2F; stroke-width: 1.5; }
    .box { fill: #1A1C21; stroke: #34363D; stroke-width: 1.2; }
    .core { fill: #1A1C21; stroke: #D7191F; stroke-width: 2; }
    .dash { fill: none; stroke: #5A5C63; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .t1 { font: 700 17px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .t2 { font: 500 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B5B5B8; }
    .tag { font: 700 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FF4750; letter-spacing: 2.5px; }
    .lbl { font: 500 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B5B5B8; }
    .rail { stroke: #3A3C43; stroke-width: 2; fill: none; }
  </style>
  <rect x="1" y="1" width="898" height="418" rx="14" class="bg"/>
  <text x="32" y="38" class="tag">ASPEN CORE · VISÃO GERAL DO SOFTWARE</text>

  <!-- trilhos -->
  <line x1="232" y1="133" x2="348" y2="133" class="rail" marker-end="url(#seta)"/>
  <line x1="550" y1="118" x2="666" y2="106" class="rail" marker-end="url(#seta)"/>
  <line x1="550" y1="148" x2="666" y2="214" class="rail" marker-end="url(#seta)"/>

  <!-- caixas -->
  <rect x="32" y="90" width="200" height="86" rx="10" class="box"/>
  <text x="132" y="126" text-anchor="middle" class="t1">Aplicações</text>
  <text x="132" y="148" text-anchor="middle" class="t2">Web e app móvel</text>

  <rect x="350" y="90" width="200" height="86" rx="10" class="core">
    <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="126" text-anchor="middle" class="t1">API</text>
  <text x="450" y="148" text-anchor="middle" class="t2">Node.js e Express</text>

  <rect x="668" y="62" width="200" height="86" rx="10" class="box"/>
  <text x="768" y="98" text-anchor="middle" class="t1">Firebase</text>
  <text x="768" y="120" text-anchor="middle" class="t2">Auth e Firestore</text>

  <rect x="668" y="178" width="200" height="86" rx="10" class="box"/>
  <text x="768" y="214" text-anchor="middle" class="t1">Mercado Pago</text>
  <text x="768" y="236" text-anchor="middle" class="t2">Pix, cartão e webhooks</text>

  <text x="290" y="122" text-anchor="middle" class="lbl">requisições</text>
  <text x="640" y="170" text-anchor="end" class="lbl">pagamentos</text>
  <text x="640" y="92" text-anchor="end" class="lbl">dados</text>

  <!-- pacotes: aplicações -> API -->
  <circle r="5" fill="#FF4750" opacity="0">
    <animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M232,133 L348,133" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.27;0.3;1"/>
  </circle>
  <!-- API -> Firebase -->
  <circle r="5" fill="#FF8A5B" opacity="0">
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite" path="M550,118 L666,106" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" begin="1s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.27;0.3;1"/>
  </circle>
  <!-- API -> Mercado Pago -->
  <circle r="5" fill="#FFC15E" opacity="0">
    <animateMotion dur="4s" begin="1.8s" repeatCount="indefinite" path="M550,148 L666,214" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" begin="1.8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.27;0.3;1"/>
  </circle>
  <!-- webhook: Mercado Pago -> API -->
  <circle r="5" fill="#FF8FB1" opacity="0">
    <animateMotion dur="4s" begin="2.8s" repeatCount="indefinite" path="M666,226 L552,162" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="4s" begin="2.8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.03;0.27;0.3;1"/>
  </circle>
  <text x="620" y="252" text-anchor="end" class="lbl">webhook</text>

  <!-- hardware -->
  <rect x="32" y="300" width="836" height="86" rx="10" class="dash">
    <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="332" class="t1">Chaves Aspen Key: Lite e Pro</text>
  <text x="56" y="356" class="t2">Hardware com ESP32 e chip criptográfico ATECC608B. Firmware da Lite em fase de testes.</text>
</svg>
