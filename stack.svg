    .mk { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; }
    .lb { font: 500 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #B5B5B8; }
    .sep { stroke: #23252B; stroke-width: 1; }
    .gl { fill: #FFFFFF; opacity: 0; animation: brilho 9s infinite both; }
    .t { animation: sobe 9s infinite both; }
    @keyframes sobe {
      0%   { transform: translateY(0); }
      2.5% { transform: translateY(-4px); }
      6%   { transform: translateY(0); }
      100% { transform: translateY(0); }
    }
    @keyframes brilho {
      0%   { opacity: 0; }
      2.5% { opacity: 0.3; }
      6%   { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .t, .gl { animation: none; }
    }
